name: Build Windows Release

on:
  push:
    branches: [main, master]
    tags: ["v*"]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure CMake (MSVC x64)
        run: cmake -B build -A x64

      - name: Build Release
        run: cmake --build build --config Release

      - name: Run Unit Tests
        run: ctest --test-dir build -C Release --output-on-failure

      - name: Verify Binary Footprint (< 1.5 MB)
        shell: pwsh
        run: |
          $exe = Get-Item "build/Release/SuperlightBattery.exe"
          Write-Host "SuperlightBattery.exe size: $($exe.Length) bytes ($([math]::Round($exe.Length / 1KB, 1)) KB)"
          if ($exe.Length -ge 1572864) {
            throw "Executable exceeds 1.5 MB target footprint!"
          }

      - name: Stage Release Package & Checksums
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Copy-Item "build/Release/SuperlightBattery.exe" "dist/"
          Copy-Item "config.example.json" "dist/"
          Copy-Item "LICENSE" "dist/"
          Push-Location dist
          Get-FileHash -Algorithm SHA256 "SuperlightBattery.exe", "config.example.json" |
            ForEach-Object { "$($_.Hash.ToLowerInvariant())  $([System.IO.Path]::GetFileName($_.Path))" } |
            Set-Content -Path "SHA256SUMS.txt" -Encoding ascii
          Get-Content "SHA256SUMS.txt"
          Pop-Location

      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: SuperlightBattery-win64
          path: dist/

      - name: Publish GitHub Release on Tag
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/SuperlightBattery.exe
            dist/config.example.json
            dist/LICENSE
            dist/SHA256SUMS.txt
          generate_release_notes: true
